<!--
  Starter stub for a DUAL-LANGUAGE post. Copy this whole _TEMPLATE folder to
  posts/<slug>/, fill in en.html and it.html, then delete this comment.
  Slug format: YYYY-MM-DD-short-title. See CLAUDE.md "Blog / adding a post".

  If the post has ONLY ONE language, delete this file (and the language you
  don't have) and rename the remaining en.html or it.html to index.html,
  adding lang="en" (or "it") data-post-langs="en" (or "it") to <html> in
  place of the stub attributes below.
-->
<!DOCTYPE HTML>
<html lang="en" data-post-stub="true" data-post-langs="en,it" data-post-default="en">
  <head>
    <title>Post title</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="icon" type="image/svg+xml" href="/images/logo-L-white.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/images/logo-L-black.svg" media="(prefers-color-scheme: light)"/>
    <script src="/assets/js/lang.js"></script>
  </head>
  <body>
    <noscript>
      <p><a href="./en.html">Read in English</a> | <a href="./it.html">Leggi in italiano</a></p>
    </noscript>
  </body>
</html>
